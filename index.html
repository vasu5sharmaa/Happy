<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Garima ❤️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Poppins:wght@300;400&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Poppins',system-ui,sans-serif;font-weight:300;--tx:#6b3f52;color:var(--tx);background:#ffe9ef;transition:color 1.2s}
body.night{--tx:#f6e9f3}
.bgl{position:fixed;inset:0;opacity:0;transition:opacity 1.4s}
.bgl.on{opacity:1}
#stars,#moon{position:fixed;opacity:0;transition:opacity 1.6s;pointer-events:none}
body.night #stars,body.night #moon{opacity:1}
#stars{inset:0;overflow:hidden}
.sl{position:absolute;inset:-10% 0;animation:drift 90s linear infinite}
.sl.b{animation-duration:45s}
.sl i{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
#moon{top:calc(env(safe-area-inset-top) + 22px);right:22px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffdf0,#f4e6b8);box-shadow:0 0 40px 12px rgba(255,240,190,.35)}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#hearts span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
.scr{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 56px) 26px calc(env(safe-area-inset-bottom) + 40px);animation:fin 1s both;transition:opacity .7s,transform .7s;z-index:2}
.scr.out{opacity:0;transform:scale(.97)}
.in{margin:auto 0;width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center}
.ls{width:100%}
.ln{font-size:1.1rem;line-height:1.75;margin:9px 0}
.w{display:inline-block;opacity:0;transform:translateY(12px) scale(.94);filter:blur(5px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.9,.3,1.2),filter 1s ease}
.ln.in2 .w{opacity:1;transform:none;filter:none}
.ln.b .w,.ln.h .w{transition-duration:1.4s}
.ln.s.in2{animation:glow 3s ease-in-out 1s 2}
@keyframes glow{50%{text-shadow:0 0 16px rgba(255,120,170,.65)}}
.ln.h{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:1.5rem;line-height:1.4;margin:16px 0}
.ln.s{font-family:'Dancing Script',cursive;font-size:1.75rem;line-height:1.3;color:#d6457a}
body.night .ln.s{color:#ffb3cf}
.ln.b{font-family:'Playfair Display',serif;font-weight:500;font-size:2.3rem;line-height:1.2;margin:22px 0;color:#ff7fa6;text-shadow:0 0 28px rgba(255,105,150,.7)}
.ln.hint{font-size:.9rem;opacity:.7}
.btn{margin-top:26px;border:0;border-radius:40px;padding:15px 34px;font:400 1rem 'Poppins',sans-serif;color:#fff;background:linear-gradient(135deg,#ff8fb0,#f0507f);opacity:0;visibility:hidden;transition:opacity 1s;animation:beat 1.7s ease-in-out infinite}
.btn.in2{opacity:1;visibility:visible}
.hrt{font-size:2.6rem;margin-bottom:14px;animation:beat 1.5s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,80,130,.8))}
.hrt.big{font-size:5.5rem;animation:beat 1.8s ease-in-out infinite,grow 30s forwards;filter:drop-shadow(0 0 30px rgba(255,60,120,.9))}
.ted{width:230px;margin-bottom:20px;animation:drop 1.3s cubic-bezier(.3,1.5,.5,1) both;position:relative}
.ted svg{width:100%;display:block;animation:sway 4s ease-in-out 1.3s infinite}
.sign{position:relative;margin:-64px auto 0;width:200px;padding:10px 8px;background:#fffaf2;border:3px solid #e9b98f;border-radius:10px;font-family:'Dancing Script',cursive;font-size:1.35rem;color:#c2456f;transform:rotate(-3deg);box-shadow:0 6px 16px rgba(150,80,90,.25)}
.env{width:190px;height:125px;background:#ffc2d4;border-radius:6px;position:relative;margin:26px 0;cursor:pointer;box-shadow:0 10px 26px rgba(200,90,120,.3);animation:beat 2s ease-in-out infinite}
.env .fl{position:absolute;top:0;left:0;border-left:95px solid transparent;border-right:95px solid transparent;border-top:78px solid #ff9db9;transform-origin:top;transition:transform .9s;z-index:3}
.env .pp{position:absolute;left:14px;right:14px;top:8px;height:95px;background:#fff;border-radius:4px;transition:transform .9s .3s;z-index:1}
.env .fr{position:absolute;inset:0;border-left:95px solid #ffb0c8;border-right:95px solid #ffb0c8;border-bottom:70px solid #ffa6c1;border-top:55px solid transparent;border-radius:6px;z-index:2}
.env .sd{position:absolute;top:52px;left:50%;margin-left:-13px;z-index:4;font-size:1.6rem;transition:opacity .4s}
.env.open{animation:none}
.env.open .fl{transform:rotateX(180deg);z-index:0}
.env.open .pp{transform:translateY(-52px)}
.env.open .sd{opacity:0}
#mu{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:16px;z-index:9;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);font-size:1.1rem;cursor:pointer}
#mu.off::after{content:"";position:absolute;left:9px;right:9px;top:20px;height:2px;background:#d6457a;transform:rotate(-45deg)}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes grow{to{font-size:8rem}}
@keyframes drop{from{transform:translateY(-120px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh) translateX(24px);opacity:0}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{to{transform:translateY(10%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="bgs"></div>
<div id="stars"><div class="sl"></div><div class="sl b"></div></div>
<div id="moon"></div>
<div id="hearts"></div>
<button id="mu" class="off" aria-label="Music">🎵</button>
<div id="app"></div>
<script>
/* MUSIC: put your song next to index.html and name it music.mp3 */
const $=s=>document.querySelector(s),sl=ms=>new Promise(r=>setTimeout(r,ms));
const BG=["linear-gradient(160deg,#ffe3ec,#fff6ea 55%,#e6dcfa)","linear-gradient(180deg,#fff7ef,#ffe6ee)","linear-gradient(160deg,#ffd9e6,#fdf1e6 50%,#dccdf7)","linear-gradient(180deg,#ffe1ec,#f3e3fb)","linear-gradient(180deg,#0b1030,#1b1c4d 70%,#3a2a5f)","radial-gradient(circle at 50% 40%,#3a1740,#0a0d2b 70%)","linear-gradient(160deg,#fff0f4,#ffe0ea 60%,#efe3ff)","linear-gradient(180deg,#fffaf0,#ffe9ef)","radial-gradient(circle at 50% 45%,#2a1236,#070a1f 75%)"];
BG.forEach(g=>{const d=document.createElement("div");d.className="bgl";d.style.background=g;$("#bgs").appendChild(d)});
for(let i=0;i<16;i++){const s=document.createElement("span");s.textContent=["💗","🤍","💕","✨"][i%4];s.style.cssText=`left:${Math.random()*95}%;font-size:${11+Math.random()*14}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*16}s`;$("#hearts").appendChild(s)}
document.querySelectorAll(".sl").forEach(l=>{for(let i=0;i<32;i++){const s=document.createElement("i"),z=1+Math.random()*2;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*3}s`;l.appendChild(s)}});

/* Screen data. Line prefixes: h| heading, s| script, b| big. Numbers = pause in ms. */
const S=[
{bg:0,t:1,l:["s|Garima...","Ek chhoti si baat kehni thi."],btn:"Open ❤️"},
{bg:1,hr:1,l:["s|Madam...","I know maine kuch mistakes ki hain...","Aur meri kuch baaton se tumhe hurt bhi hua.","h|I'm genuinely sorry. ❤️","Bas dil se sorry bolna tha, Madam."],btn:"Ab thodi si dil ki baat... ❤️"},
{bg:2,hr:1,l:["s|Waise Madam...","Sorry toh bol diya...",1400,"Ab thodi si dil ki baat bhi kar loon? ❤️"],btn:"Haan, karo ❤️"},
{bg:2,l:["s|Pata hai Garima...","Tum mere liye itni special kab ban gayi,<br>mujhe khud nahi pata.",1000,"Tumhari ek smile mera mood theek kar sakti hai.","Tumhari chhoti si baat bhi<br>mere dimaag mein poora din reh sakti hai.","Tumhara gussa bhi cute lagta hai...","Aur tumhara care...","Woh toh dil mein seedha ghar kar gaya. ❤️",1000,"h|Tum meri favourite person ho, Madam."],btn:"Lekin baat itni si nahi hai..."},
{bg:3,l:["h|I love the little things about you...",800,"Tumhari smile...","Tumhari random baatein...","Tumhara gussa...","Tumhara mujhe chidhana...","Tumhara care karna...","Tumhari woh cute si baatein...","Aur tumhara woh simple sa 'hmm' bhi. ❤️",1200,"Pata nahi kyun...","Par tumhari ye chhoti-chhoti cheezein<br>mere liye bahut badi hain.",1000,"s|Because they're yours. ❤️"],btn:"Aur ab asli baat..."},
{bg:4,n:1,l:["h|Why I love you...",800,"Tumhare saath main apna real self hoon.","Tumhari presence mein<br>ordinary moments bhi special lagte hain.","Tumhari smile mujhe genuinely khush karti hai.","Tumhari happiness matter karti hai.","Tumhari little things mujhe yaad rehti hain.",1200,"Aur sabse important...",1800,"h|Mujhe tum pasand ho.",1800,"s|Exactly jaisi tum ho. ❤️"],btn:"Ek confession aur..."},
{bg:5,n:1,hr:2,l:["s|Garima...",1500,"Main shayad har baar perfect tareeke se express nahi kar pata...","Kabhi words kam pad jaate hain...","Kabhi feelings zyada ho jaati hain...",1500,"b|I LOVE YOU, GARIMA. ❤️",2000,"h|Bahut.",3000,"Aur mera pyaar sirf 'I love you' bolne tak nahi hai.","Main tumhari happiness care karta hoon.","Tumhari little things notice karta hoon.","Tumhari smile mujhe genuinely khush karti hai.","Tumhara khayal rakhna<br>mere liye kabhi burden nahi hoga.",1200,"Tum mere liye sirf koi person nahi ho...","h|Tum meri Madam ho. ❤️"],btn:"Madam... ❤️"},
{bg:6,t:2,l:["s|Madam...","Agar mujhe tumhare liye<br>sirf kuch words choose karne ho...",1200,"h|My favourite person. ❤️","h|My comfort.","h|My happiness.","h|My safe place.",1200,"Aur sabse simple...","b|My Love. ❤️",1500,"Bas itna hi kehna tha...","h|I love you, Madam.",1000,"s|Aaj bhi. ❤️"],btn:"💌"},
{bg:7,env:1,l:["s|Madam, ek last chhoti si baat...","hint|Envelope par tap karo"]},
{bg:7,l:["s|Thank you...","Meri life mein aane ke liye.","Meri random baatein sunne ke liye.","Mere saath hansi share karne ke liye.","Aur woh saare little moments dene ke liye<br>jo mere liye actually bahut special hain.",1200,"I don't know how many ways<br>I can say it...",1500,"b|But I love you. ❤️",1200,"Bahut saara.",1200,"h|Take care of yourself, Garima. ❤️","s|And keep smiling, Madam. 🫶🏻",800,"s|— Vatsal ❤️"],auto:5000},
{bg:8,n:1,hr:1,l:["s|For Garima...",1200,"h|With all my heart. ❤️",1200,"s|— Vatsal"],end:1}
];

const teddy=m=>`<div class="ted"><svg viewBox="0 0 200 210"><circle cx="52" cy="46" r="23" fill="#d9a77a"/><circle cx="148" cy="46" r="23" fill="#d9a77a"/><circle cx="52" cy="46" r="12" fill="#f2c9a8"/><circle cx="148" cy="46" r="12" fill="#f2c9a8"/><ellipse cx="100" cy="168" rx="44" ry="40" fill="#e2b48a"/><ellipse cx="100" cy="172" rx="27" ry="25" fill="#f6dcc0"/><circle cx="58" cy="150" r="15" fill="#d9a77a"/><circle cx="142" cy="150" r="15" fill="#d9a77a"/><circle cx="100" cy="86" r="56" fill="#e2b48a"/><ellipse cx="100" cy="106" rx="25" ry="19" fill="#f6dcc0"/><ellipse cx="100" cy="98" rx="7" ry="4.5" fill="#7a4a35"/><path d="${m==1?'M93 114q7-5 14 0':'M92 109q8 9 16 0'}" stroke="#7a4a35" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="79" cy="80" r="6" fill="#3b2418"/><circle cx="121" cy="80" r="6" fill="#3b2418"/><circle cx="81" cy="78" r="2" fill="#fff"/><circle cx="123" cy="78" r="2" fill="#fff"/>${m==1?'<path d="M68 66l17 6M132 66l-17 6" stroke="#7a4a35" stroke-width="2.5" stroke-linecap="round"/>':''}<ellipse cx="66" cy="102" rx="9" ry="5.5" fill="#ff9fb2" opacity=".65"/><ellipse cx="134" cy="102" rx="9" ry="5.5" fill="#ff9fb2" opacity=".65"/>${m==2?'<text x="100" y="182" font-size="34" text-anchor="middle" style="filter:drop-shadow(0 0 6px #ff4f86)">❤️</text>':''}</svg>${m==1?'<div class="sign">I\'m Sorry, Madam 🥺❤️</div>':''}</div>`;

let cur=-1;
async function go(i){
 const old=$(".scr");if(old){old.classList.add("out");await sl(700);old.remove()}
 cur=i;const d=S[i];
 document.querySelectorAll(".bgl").forEach((b,k)=>b.classList.toggle("on",k==d.bg));
 document.body.classList.toggle("night",!!d.n);
 const el=document.createElement("div");el.className="scr";
 el.innerHTML=`<div class="in">${d.t?teddy(d.t):""}${d.hr?`<div class="hrt${d.hr==2?" big":""}">❤️</div>`:""}${d.env?'<div class="env"><div class="pp"></div><div class="fl"></div><div class="fr"></div><div class="sd">❤️</div></div>':""}<div class="ls"></div>${d.btn?`<button class="btn">${d.btn}</button>`:""}</div>`;
 $("#app").appendChild(el);
 if(d.env)el.querySelector(".env").onclick=async function(){if(this.dataset.d)return;this.dataset.d=1;this.classList.add("open");await sl(1500);go(cur+1)};
 await sl(d.t?1500:900);
 const ls=el.querySelector(".ls");
 for(const x of d.l){
  if(typeof x=="number"){await sl(x);continue}
  const m=x.match(/^(h|s|b|hint)\|/),p=document.createElement("div");
  const tx=m?x.slice(m[0].length):x,st=m&&(m[1]=="b"||m[1]=="h")?.28:.18;let n=0;p.className="ln "+(m?m[1]:"");p.innerHTML=tx.split("<br>").map(l=>l.split(" ").map(w=>`<span class="w" style="transition-delay:${(n++*st).toFixed(2)}s">${w}</span>`).join(" ")).join("<br>");p.dataset.t=n*st;ls.appendChild(p);
  void p.offsetWidth;p.classList.add("in2");el.scrollTo({top:el.scrollHeight,behavior:"smooth"});
  await sl(+p.dataset.t*1000+1250);
 }
 if(d.auto){await sl(d.auto);go(cur+1)}
 else if(d.btn){const b=el.querySelector(".btn");b.classList.add("in2");b.onclick=()=>{b.onclick=null;go(cur+1)};el.scrollTo({top:el.scrollHeight,behavior:"smooth"})}
}
/* music (off by default) */
const au=new Audio("music.mp3");au.loop=true;au.volume=.5;let want=true;
const mu=$("#mu");mu.classList.remove("off");
const start=()=>{if(want&&au.paused)au.play().catch(()=>{})};
start();
["pointerdown","touchend","keydown"].forEach(e=>addEventListener(e,start));
mu.onclick=()=>{want=!want;if(want)au.play().catch(()=>{});else au.pause();mu.classList.toggle("off",!want)};
go(0);
</script>
</body>
</html>
